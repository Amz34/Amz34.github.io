<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ElevateTwin AI — Argon</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
</script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: #020810;
    overflow: hidden;
    font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
    color: #e2e8f0;
    user-select: none;
  }

  canvas { display:block; }

  /* ── TOP BRAND ── */
  #brand {
    position: fixed; top: 20px; left: 24px;
    display: flex; align-items: center; gap: 10px;
    z-index: 10;
  }
  #brand-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #10b981;
    box-shadow: 0 0 10px #10b981;
    animation: pulse 2s infinite;
  }
  #brand-name {
    font-size: 12px; font-weight: 700;
    letter-spacing: .12em; text-transform: uppercase;
    color: #94a3b8;
  }
  #brand-name span { color: #38bdf8; }

  /* ── PHASE BADGE (top right) ── */
  #phase-badge {
    position: fixed; top: 20px; right: 24px;
    font-size: 10px; font-weight: 700;
    letter-spacing: .12em; text-transform: uppercase;
    padding: 6px 14px; border-radius: 6px;
    border: 1px solid rgba(56,189,248,.3);
    background: rgba(56,189,248,.07);
    color: #38bdf8;
    z-index: 10;
    transition: all .5s ease;
  }
  #phase-badge.warn {
    border-color: rgba(251,191,36,.4);
    background: rgba(251,191,36,.08);
    color: #fbbf24;
  }
  #phase-badge.crit {
    border-color: rgba(244,63,94,.4);
    background: rgba(244,63,94,.08);
    color: #f43f5e;
    animation: border-pulse 1s infinite;
  }

  /* ── NARRATIVE BLOCK (center bottom) ── */
  #narrative {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    padding: 0 0 32px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    z-index: 10;
    pointer-events: none;
  }

  #narr-step {
    font-size: 9px; font-weight: 700;
    letter-spacing: .18em; text-transform: uppercase;
    color: #334155;
  }

  #narr-title {
    font-size: 22px; font-weight: 700;
    color: #f1f5f9;
    text-align: center;
    transition: opacity .6s;
    letter-spacing: -.01em;
    line-height: 1.25;
    max-width: 640px;
    padding: 0 24px;
  }

  #narr-sub {
    font-size: 13px;
    color: #475569;
    text-align: center;
    max-width: 520px;
    padding: 0 24px;
    line-height: 1.6;
    transition: opacity .6s;
  }

  /* Progress dots */
  #progress-dots {
    display: flex; gap: 7px; margin-top: 2px;
  }
  .pdot {
    width: 5px; height: 5px; border-radius: 50%;
    background: rgba(255,255,255,.1);
    transition: background .4s, box-shadow .4s;
  }
  .pdot.active {
    background: #38bdf8;
    box-shadow: 0 0 8px #38bdf8;
  }
  .pdot.done {
    background: rgba(56,189,248,.3);
  }

  /* ── 3 TELEMETRY CHIPS (left side, minimal) ── */
  #tel-strip {
    position: fixed; left: 24px;
    top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 10px;
    z-index: 10;
  }
  .tel-chip {
    display: flex; flex-direction: column; gap: 2px;
  }
  .tel-chip-label {
    font-size: 8px; letter-spacing: .12em;
    text-transform: uppercase; color: #334155;
  }
  .tel-chip-value {
    font-size: 15px; font-weight: 700;
    transition: color .4s;
  }
  .tel-chip-bar {
    width: 64px; height: 2px; background: rgba(255,255,255,.05);
    border-radius: 1px; overflow: hidden;
  }
  .tel-chip-fill {
    height: 100%; border-radius: 1px;
    background: #10b981;
    transition: width .6s, background .4s;
  }

  /* ── ANOMALY BORDER ── */
  #anomaly-ring {
    position: fixed; inset: 0;
    border: 2px solid transparent;
    pointer-events: none; z-index: 5;
    transition: border-color .4s, box-shadow .4s;
  }
  #anomaly-ring.on {
    border-color: rgba(244,63,94,.4);
    box-shadow: inset 0 0 80px rgba(244,63,94,.06);
    animation: border-pulse 1.5s infinite;
  }

  /* ── FADE OVERLAY (for transitions) ── */
  #fade {
    position: fixed; inset: 0;
    background: #020810;
    opacity: 0; pointer-events: none;
    z-index: 20;
    transition: opacity .5s;
  }
  #fade.on { opacity: 1; }

  @keyframes pulse {
    0%,100% { opacity:1; } 50% { opacity:.3; }
  }
  @keyframes border-pulse {
    0%,100% { border-color: rgba(244,63,94,.35); }
    50%      { border-color: rgba(244,63,94,.75); }
  }
</style>
</head>
<body>

<div id="brand">
  <div id="brand-dot"></div>
  <div id="brand-name">Elevate<span>Twin</span> AI</div>
</div>

<div id="phase-badge">Initializing</div>
<div id="anomaly-ring"></div>
<div id="fade"></div>

<!-- Minimal telemetry strip -->
<div id="tel-strip">
  <div class="tel-chip">
    <div class="tel-chip-label">Motor</div>
    <div class="tel-chip-value" id="t-temp" style="color:#10b981">48°C</div>
    <div class="tel-chip-bar"><div class="tel-chip-fill" id="b-temp" style="width:30%"></div></div>
  </div>
  <div class="tel-chip">
    <div class="tel-chip-label">Vibration</div>
    <div class="tel-chip-value" id="t-vib" style="color:#10b981">0.11g</div>
    <div class="tel-chip-bar"><div class="tel-chip-fill" id="b-vib" style="width:8%"></div></div>
  </div>
  <div class="tel-chip">
    <div class="tel-chip-label">Bearing</div>
    <div class="tel-chip-value" id="t-bearing" style="color:#10b981">98%</div>
    <div class="tel-chip-bar"><div class="tel-chip-fill" id="b-bearing" style="width:98%"></div></div>
  </div>
</div>

<!-- Narrative -->
<div id="narrative">
  <div id="narr-step">Phase 1 of 5</div>
  <div id="narr-title">Scanning shaft geometry…</div>
  <div id="narr-sub">Gemini 4 Argon is ingesting traction motor telemetry, cable tension harmonics, and counterweight delta across all 40 floors.</div>
  <div id="progress-dots">
    <div class="pdot active" id="pd0"></div>
    <div class="pdot" id="pd1"></div>
    <div class="pdot" id="pd2"></div>
    <div class="pdot" id="pd3"></div>
    <div class="pdot" id="pd4"></div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls }   from 'three/addons/controls/OrbitControls.js';
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass }      from 'three/addons/postprocessing/OutputPass.js';

// ── Renderer ──────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type    = THREE.PCFSoftShadowMap;
renderer.toneMapping       = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace  = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

// ── Scene / Camera ─────────────────────────────────────────────────
const scene  = new THREE.Scene();
scene.background = new THREE.Color(0x020810);
scene.fog        = new THREE.FogExp2(0x020810, 0.014);

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 400);
camera.position.set(26, 28, 36);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 18, 0);
controls.enableDamping   = true;
controls.dampingFactor   = 0.05;
controls.autoRotate      = false;
controls.autoRotateSpeed = 0.4;

// ── Post-processing ────────────────────────────────────────────────
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.5, 0.4, 0.62);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ── Lights ─────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x0c1525, 2.2));
const sun = new THREE.DirectionalLight(0x6fa8d8, 2.0);
sun.position.set(18, 55, 22);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
[-30,30].forEach(v => sun.shadow.camera.left = sun.shadow.camera.bottom = v);
[30,-30].forEach(v => sun.shadow.camera.right = sun.shadow.camera.top = v);
sun.shadow.bias = -0.001;
scene.add(sun);
scene.add(Object.assign(new THREE.DirectionalLight(0x1a2f50, 0.7), { position: new THREE.Vector3(-15,15,-20) }));

const motorGlow = new THREE.PointLight(0x10b981, 5, 16);
motorGlow.position.set(0, 43, 0);
scene.add(motorGlow);

// ── Materials helper ───────────────────────────────────────────────
const M = (c, metal=.7, rough=.3, emis=null, ei=0) => new THREE.MeshStandardMaterial(
  { color:c, metalness:metal, roughness:rough, ...(emis ? {emissive:emis, emissiveIntensity:ei} : {}) }
);

// ── Geometry ────────────────────────────────────────────────────────
const H=40, W=6, D=6;

// Ground
const gnd = new THREE.Mesh(new THREE.PlaneGeometry(100,100), M(0x030b18, 0, 1));
gnd.rotation.x = -Math.PI/2; gnd.receiveShadow = true;
scene.add(gnd);
scene.add(new THREE.GridHelper(80, 80, 0x0a1830, 0x050d1a));

// Shaft walls (subtle glass)
const glassMat = new THREE.MeshStandardMaterial(
  { color:0x0f2545, metalness:.1, roughness:.05, transparent:true, opacity:.09, side:THREE.DoubleSide }
);
[ [W/2+.1, H/2, 0, .1, H, D],  [-W/2-.1, H/2, 0, .1, H, D],
  [0, H/2,  D/2+.1, W, H, .1], [0, H/2, -D/2-.1, W, H, .1]
].forEach(([x,y,z,gw,gh,gd]) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(gw,gh,gd), glassMat);
  m.position.set(x,y,z); scene.add(m);
});

// Rails
const railM = M(0x122040, .92, .12);
[[- W/2+.35, H/2, 0],[W/2-.35, H/2, 0],[-W/2+.35, H/2,-D/2+.35],[W/2-.35, H/2,-D/2+.35]].forEach(([x,y,z]) => {
  const r = new THREE.Mesh(new THREE.BoxGeometry(.22,H,.22), railM);
  r.position.set(x,y,z); r.castShadow=true; scene.add(r);
});

// Floor slabs
for (let f=0; f<=H; f+=4) {
  const s = new THREE.Mesh(new THREE.BoxGeometry(W+2,.1,D+2), M(0x091525,.4,.9));
  s.position.y = f; s.receiveShadow = true; scene.add(s);
}

// Machine room
const mrGroup = new THREE.Group();
mrGroup.position.set(0, H+1, 0);
mrGroup.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(8,.8,8), M(0x091520,.6,.8)), {receiveShadow:true}));
const motorBlock = new THREE.Mesh(new THREE.BoxGeometry(3.2,1.8,3.2), M(0x142840,.85,.2));
motorBlock.position.y = 1.3; motorBlock.castShadow=true; mrGroup.add(motorBlock);

// Sheave
const sheaveMat = M(0x0d3830, .9, .15, 0x10b981, 1.6);
const sheaveMesh= new THREE.Mesh(new THREE.CylinderGeometry(1.35,1.35,.75,48), sheaveMat);
sheaveMesh.rotation.x = Math.PI/2; sheaveMesh.position.set(0,2.8,0); mrGroup.add(sheaveMesh);
scene.add(mrGroup);

// ── Elevator Cab ────────────────────────────────────────────────────
const cab = new THREE.Group();
const cabMat = new THREE.MeshStandardMaterial(
  { color:0x0e2848, metalness:.75, roughness:.08, transparent:true, opacity:.9, emissive:0x091a38, emissiveIntensity:.5 }
);
const cabMesh = new THREE.Mesh(new THREE.BoxGeometry(2.8,3.4,2.8), cabMat);
cabMesh.castShadow=cabMesh.receiveShadow=true; cab.add(cabMesh);

// Edge glow lines
const edgeGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(2.85,3.45,2.85));
const edgeMat = new THREE.LineBasicMaterial({ color:0x38bdf8 });
cab.add(new THREE.LineSegments(edgeGeo, edgeMat));

const cabLight = new THREE.PointLight(0x7dd3fc, 2, 8);
cab.add(cabLight);
cab.position.set(0,16,0);
scene.add(cab);

// ── Counterweight ───────────────────────────────────────────────────
const cw = new THREE.Mesh(new THREE.BoxGeometry(1.2,3,.8), M(0x2e1200,.8,.3,0xf59e0b,.7));
cw.castShadow=true; cw.position.set(0, H-16, -D/2+.5);
scene.add(cw);

// ── Cables (multi-strand) ───────────────────────────────────────────
const cablesGroup = new THREE.Group();
scene.add(cablesGroup);
const CABLE_MAT = new THREE.LineBasicMaterial({ color:0x1e3a5f });
const cableLines = [];
[-0.3, 0, 0.3].forEach(ox => {
  const g = new THREE.BufferGeometry();
  const l = new THREE.Line(g, CABLE_MAT);
  cablesGroup.add(l); cableLines.push({ line:l, ox });
});
function updateCables(y) {
  cableLines.forEach(({line, ox}) => {
    line.geometry.setFromPoints([
      new THREE.Vector3(ox, y+1.75, 0),
      new THREE.Vector3(ox, H+3.5, 0)
    ]);
  });
}

// ── Particles (motor heat plume) ────────────────────────────────────
const PC = 300;
const pPos = new Float32Array(PC*3), pVel = new Float32Array(PC*3), pLife = new Float32Array(PC);
function resetP(i) {
  const a=Math.random()*Math.PI*2, r=Math.random()*.5;
  pPos[i*3]=Math.cos(a)*r; pPos[i*3+1]=H+4.2+Math.random()*.4; pPos[i*3+2]=Math.sin(a)*r;
  pVel[i*3]=(Math.random()-.5)*.035; pVel[i*3+1]=.05+Math.random()*.07; pVel[i*3+2]=(Math.random()-.5)*.035;
  pLife[i]=Math.random();
}
for (let i=0;i<PC;i++) resetP(i);
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos,3));
const pMat = new THREE.PointsMaterial({ color:0x6366f1, size:.18, transparent:true, opacity:.6 });
const particles = new THREE.Points(pGeo, pMat);
scene.add(particles);

// ── Spark particles (fault only) ────────────────────────────────────
const SC=120;
const sPos=new Float32Array(SC*3), sVel=new Float32Array(SC*3), sLife=new Float32Array(SC);
function resetS(i,cx,cy) {
  sPos[i*3]=cx+(Math.random()-.5)*2; sPos[i*3+1]=cy+(Math.random()-.5)*2; sPos[i*3+2]=(Math.random()-.5)*2;
  sVel[i*3]=(Math.random()-.5)*.22; sVel[i*3+1]=Math.random()*.16; sVel[i*3+2]=(Math.random()-.5)*.22;
  sLife[i]=Math.random();
}
for(let i=0;i<SC;i++) resetS(i,0,16);
const sGeo=new THREE.BufferGeometry();
sGeo.setAttribute('position', new THREE.BufferAttribute(sPos,3));
const sMat=new THREE.PointsMaterial({color:0xf43f5e, size:.16, transparent:true, opacity:0});
const sparks=new THREE.Points(sGeo, sMat);
scene.add(sparks);

// ── State ────────────────────────────────────────────────────────────
let cabY    = 16;
let tgtY    = 30;
let anomaly = false;
const clock = new THREE.Clock();

// ── Camera poses ─────────────────────────────────────────────────────
const POSES = [
  { pos:[26,28,36], tgt:[0,18,0] },   // overview
  { pos:[8,17,10],  tgt:[0,15,0] },   // cab close
  { pos:[7,H+5,8],  tgt:[0,H+2,0] },  // motor
  { pos:[26,28,36], tgt:[0,18,0] },   // back overview
  { pos:[5, 4, 9],  tgt:[0,2,0]  },   // pit view
];
let camFrom = { pos:[26,28,36], tgt:[0,18,0] };
let camTo   = { pos:[26,28,36], tgt:[0,18,0] };
let camT    = 1;

function lerpCam(dt) {
  if (camT >= 1) return;
  camT = Math.min(1, camT + dt * .9);
  const t = 1 - (1-camT)**3;
  camera.position.lerpVectors(
    new THREE.Vector3(...camFrom.pos),
    new THREE.Vector3(...camTo.pos), t
  );
  controls.target.lerpVectors(
    new THREE.Vector3(...camFrom.tgt),
    new THREE.Vector3(...camTo.tgt), t
  );
}

function moveCamTo(pose) {
  camFrom = {
    pos:[camera.position.x, camera.position.y, camera.position.z],
    tgt:[controls.target.x, controls.target.y, controls.target.z]
  };
  camTo = pose; camT = 0;
}

// ── Narrative phases ─────────────────────────────────────────────────
const PHASES = [
  {
    dur:   5,
    badge: 'Monitoring',
    badgeCls: '',
    title: 'All systems nominal across 40 floors.',
    sub:   'Gemini 4 Argon is continuously sampling vibration harmonics, cable tension, and motor thermal gradients — 1,200 data points per second.',
    cam:   POSES[0],
    fn:    () => { anomaly=false; setNormal(); }
  },
  {
    dur:   5,
    badge: 'Deep Inspection',
    badgeCls: '',
    title: 'Zooming into traction motor.',
    sub:   'Argon\'s multimodal inference is cross-referencing bearing frequency spectrum against 38 months of historical fault signatures.',
    cam:   POSES[2],
    fn:    () => { anomaly=false; setNormal(); }
  },
  {
    dur:   6,
    badge: '⚠  ANOMALY DETECTED',
    badgeCls: 'warn',
    title: 'Bearing 3B harmonic spike detected.',
    sub:   'Vibration RMS jumped to 0.91g. Motor temperature climbing +36°C in 90 seconds. Gemini 4 Argon confidence: 97.4% catastrophic seizure in 4.2 hours.',
    cam:   POSES[1],
    fn:    () => { anomaly=true; setFault(); }
  },
  {
    dur:   6,
    badge: '🔴  CRITICAL FAULT',
    badgeCls: 'crit',
    title: 'Autonomous remediation prescribed.',
    sub:   'Argon issued: switch cab to gentle deceleration profile. Dispatch field tech — SKF 6205-2RSH bearing replacement. Zero human intervention required to diagnose.',
    cam:   POSES[2],
    fn:    () => { anomaly=true; setFault(); }
  },
  {
    dur:   5,
    badge: 'Restored',
    badgeCls: '',
    title: 'Fault cleared. System restored.',
    sub:   'This is what $40,000/year Mitsubishi contracts cannot do: predict and prescribe 48 hours before failure — autonomously, at 1/10th the cost.',
    cam:   POSES[0],
    fn:    () => { anomaly=false; setNormal(); }
  },
];

let phaseIdx = 0;
let phaseTimer = 0;
let started = false;

function setNormal() {
  document.getElementById('anomaly-ring').className = '';
  bloom.strength = .5;
  motorGlow.color.setHex(0x10b981);
  pMat.color.setHex(0x6366f1);
  cabMat.emissive.setHex(0x091a38);
  cabMat.emissiveIntensity = .5;
  edgeMat.color.setHex(0x38bdf8);
  controls.autoRotate = false;
}

function setFault() {
  document.getElementById('anomaly-ring').className = 'on';
  bloom.strength = .95;
  motorGlow.color.setHex(0xf43f5e);
  pMat.color.setHex(0xf43f5e);
  cabMat.emissive.setHex(0x3d0012);
  cabMat.emissiveIntensity = .8;
  edgeMat.color.setHex(0xf43f5e);
}

function applyPhase(p) {
  // Update badge
  const badge = document.getElementById('phase-badge');
  badge.textContent = p.badge;
  badge.className = p.badgeCls ? `${p.badgeCls}` : '';

  // Update narrative
  document.getElementById('narr-step').textContent = `Phase ${phaseIdx+1} of ${PHASES.length}`;
  document.getElementById('narr-title').textContent = p.title;
  document.getElementById('narr-sub').textContent = p.sub;

  // Dots
  for (let i=0; i<PHASES.length; i++) {
    const d = document.getElementById(`pd${i}`);
    d.className = i < phaseIdx ? 'pdot done' : i === phaseIdx ? 'pdot active' : 'pdot';
  }

  // Camera
  moveCamTo(p.cam);

  // Effect
  p.fn();
}

// Telemetry updater
function updateTel(dt) {
  const tempV = anomaly
    ? (84 + Math.sin(Date.now()*.0008)*3).toFixed(0) + '°C'
    : (47 + Math.sin(Date.now()*.001)*1.2).toFixed(0) + '°C';
  const vibV = anomaly
    ? (.75 + Math.random()*.25).toFixed(2)+'g'
    : (.09 + Math.random()*.04).toFixed(2)+'g';
  const bearV = anomaly
    ? Math.max(12, 38 - phaseTimer*2).toFixed(0)+'%'
    : '98%';

  const tempC = anomaly ? '#f43f5e' : '#10b981';
  const vibC  = anomaly ? '#f43f5e' : '#10b981';
  const bearC = anomaly ? (parseFloat(bearV)<50?'#f43f5e':'#fbbf24') : '#10b981';

  const tempPct  = anomaly ? Math.min(95, 40+phaseTimer*4) : 30;
  const vibPct   = anomaly ? Math.min(95, 50+Math.random()*20) : Math.random()*8+4;
  const bearPct  = anomaly ? Math.max(12, 98 - phaseTimer*4) : 98;

  set('t-temp',    tempV, tempC);
  set('t-vib',     vibV,  vibC);
  set('t-bearing', bearV, bearC);
  setBar('b-temp',    tempPct,  anomaly ? '#f43f5e' : '#10b981');
  setBar('b-vib',     vibPct,   anomaly ? '#f43f5e' : '#38bdf8');
  setBar('b-bearing', bearPct,  anomaly ? (bearPct<50?'#f43f5e':'#fbbf24') : '#10b981');
}

function set(id, v, color) {
  const el = document.getElementById(id);
  if (!el) return; el.textContent=v; el.style.color=color;
}
function setBar(id, pct, color) {
  const el = document.getElementById(id);
  if (!el) return; el.style.width=pct+'%'; el.style.background=color;
}

// ── Main loop ─────────────────────────────────────────────────────────
let firstFrame = true;
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  // Start sequence after 1 frame
  if (firstFrame) { firstFrame=false; applyPhase(PHASES[0]); started=true; }

  // Phase timer
  if (started) {
    phaseTimer += dt;
    const cur = PHASES[phaseIdx];
    if (phaseTimer > cur.dur) {
      phaseTimer = 0;
      phaseIdx   = (phaseIdx + 1) % PHASES.length;
      applyPhase(PHASES[phaseIdx]);
    }
  }

  // Cab movement
  const diff = tgtY - cabY;
  if (Math.abs(diff) > .08) {
    cabY += Math.sign(diff) * Math.min(.18, Math.abs(diff)*.08 + .05);
  } else {
    tgtY = 3 + Math.random() * (H-6);
  }
  cab.position.y = cabY;
  cw.position.y  = H - cabY;
  cabLight.position.copy(cab.position);
  updateCables(cabY);
  sheaveMesh.rotation.y += (tgtY > cabY ? 1 : -1) * .02;

  // Particles
  for (let i=0;i<PC;i++) {
    pLife[i] -= dt * (anomaly?.9:.55);
    if (pLife[i]<=0) { resetP(i); continue; }
    pPos[i*3]   += pVel[i*3];
    pPos[i*3+1] += pVel[i*3+1] * (anomaly?1.7:1);
    pPos[i*3+2] += pVel[i*3+2];
  }
  pGeo.attributes.position.needsUpdate = true;
  pMat.opacity = anomaly ? .85 : .55;

  // Sparks
  if (anomaly) {
    sMat.opacity = .9;
    for (let i=0;i<SC;i++) {
      sLife[i] -= dt*1.5;
      if (sLife[i]<=0) { resetS(i, cab.position.x, cabY); continue; }
      sPos[i*3]   += sVel[i*3];
      sPos[i*3+1] += sVel[i*3+1];
      sPos[i*3+2] += sVel[i*3+2];
      sVel[i*3+1] -= dt*.18;
    }
    sGeo.attributes.position.needsUpdate = true;
  } else { sMat.opacity = 0; }

  // Motor glow pulse
  motorGlow.intensity = anomaly
    ? 5 + Math.sin(Date.now()*.015)*3
    : 2.5 + Math.sin(Date.now()*.003)*.5;

  lerpCam(dt);
  updateTel(dt);
  controls.update();
  composer.render();
}
animate();

// Resize
window.addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
