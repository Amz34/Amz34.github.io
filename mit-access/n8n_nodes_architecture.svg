<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#0e172a"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="480" fill="url(#bgGrad)" rx="16"/>
  <rect width="1096" height="476" x="2" y="2" fill="none" stroke="#1e293b" stroke-width="2" rx="15"/>

  <!-- Canvas Grid Dots -->
  <g opacity="0.15">
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#94a3b8"/>
    </pattern>
    <rect width="1100" height="480" fill="url(#dotGrid)"/>
  </g>

  <!-- Header Info -->
  <g transform="translate(40, 45)">
    <rect x="0" y="0" width="1020" height="48" fill="#131c2e" rx="8" stroke="#1e293b" stroke-width="1"/>
    <circle cx="24" cy="24" r="6" fill="#10b981"/>
    <text x="40" y="29" fill="#f8fafc" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="700" font-size="16">n8n Enterprise Automation Canvas · Workflow ID: WJD5j6p7KFE3pkJb</text>
    <rect x="880" y="12" width="120" height="24" fill="#0d9488" rx="12"/>
    <text x="940" y="28" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="600" font-size="12" text-anchor="middle">STATUS: ACTIVE</text>
  </g>

  <!-- Connecting Lines -->
  <!-- Line 1 -> 2 -->
  <path d="M 280 230 L 370 230" fill="none" stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="280" cy="230" r="4" fill="#0d9488"/>
  <circle cx="370" cy="230" r="4" fill="#38bdf8"/>

  <!-- Line 2 -> 3 -->
  <path d="M 590 230 L 680 230" fill="none" stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="590" cy="230" r="4" fill="#0d9488"/>
  <circle cx="680" cy="230" r="4" fill="#38bdf8"/>

  <!-- Line 3 -> 4 -->
  <path d="M 900 230 L 990 230" fill="none" stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="900" cy="230" r="4" fill="#0d9488"/>
  <circle cx="990" cy="230" r="4" fill="#38bdf8"/>

  <!-- Node 1: Webhook -->
  <g transform="translate(60, 150)">
    <rect x="0" y="0" width="220" height="160" fill="url(#nodeGrad)" rx="12" stroke="#0d9488" stroke-width="2" filter="url(#glow)"/>
    <rect x="16" y="16" width="36" height="36" fill="#042f2e" rx="8" stroke="#0d9488" stroke-width="1"/>
    <text x="34" y="40" fill="#2dd4bf" font-family="sans-serif" font-size="18" text-anchor="middle">⚡</text>
    <text x="62" y="32" fill="#2dd4bf" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">TRIGGER</text>
    <text x="62" y="48" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="600" font-size="14">MIT Lead Webhook</text>
    <line x1="16" y1="68" x2="204" y2="68" stroke="#334155" stroke-width="1"/>
    <text x="16" y="92" fill="#94a3b8" font-family="monospace" font-size="12">POST /webhook/mit-lead</text>
    <text x="16" y="112" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Cloudflare Tunnel Bridge</text>
    <rect x="16" y="126" width="80" height="20" fill="#1e293b" rx="4"/>
    <text x="56" y="140" fill="#cbd5e1" font-family="monospace" font-size="10" text-anchor="middle">Port: 5680</text>
  </g>

  <!-- Node 2: Code Validation -->
  <g transform="translate(370, 150)">
    <rect x="0" y="0" width="220" height="160" fill="url(#nodeGrad)" rx="12" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="16" y="16" width="36" height="36" fill="#082f49" rx="8" stroke="#38bdf8" stroke-width="1"/>
    <text x="34" y="40" fill="#38bdf8" font-family="sans-serif" font-size="18" text-anchor="middle">⚙️</text>
    <text x="62" y="32" fill="#38bdf8" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">LOGIC &amp; QA</text>
    <text x="62" y="48" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="600" font-size="14">Validate &amp; Sanitize</text>
    <line x1="16" y1="68" x2="204" y2="68" stroke="#334155" stroke-width="1"/>
    <text x="16" y="92" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">• Regex Corporate Email</text>
    <text x="16" y="112" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">• XSS &amp; Inversion Guard</text>
    <text x="16" y="132" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">• Format Telegram Payload</text>
  </g>

  <!-- Node 3: Telegram Notification -->
  <g transform="translate(680, 150)">
    <rect x="0" y="0" width="220" height="160" fill="url(#nodeGrad)" rx="12" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="16" y="16" width="36" height="36" fill="#1e1b4b" rx="8" stroke="#6366f1" stroke-width="1"/>
    <text x="34" y="40" fill="#818cf8" font-family="sans-serif" font-size="18" text-anchor="middle">📱</text>
    <text x="62" y="32" fill="#818cf8" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">NOTIFIER</text>
    <text x="62" y="48" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="600" font-size="14">Telegram @AzGem_Bot</text>
    <line x1="16" y1="68" x2="204" y2="68" stroke="#334155" stroke-width="1"/>
    <text x="16" y="92" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">• Chat ID: 8843884232</text>
    <text x="16" y="112" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">• Instant Lead Alert</text>
    <text x="16" y="132" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">• Name, Email, Project Role</text>
  </g>

  <!-- Node 4: Respond to Webhook -->
  <g transform="translate(990, 150)">
    <rect x="0" y="0" width="80" height="160" fill="url(#nodeGrad)" rx="12" stroke="#10b981" stroke-width="1.5"/>
    <rect x="22" y="16" width="36" height="36" fill="#064e3b" rx="8" stroke="#10b981" stroke-width="1"/>
    <text x="40" y="40" fill="#34d399" font-family="sans-serif" font-size="18" text-anchor="middle">↩️</text>
    <text x="40" y="80" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="700" font-size="10" text-anchor="middle">HTTP 200</text>
    <text x="40" y="100" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="600" font-size="11" text-anchor="middle">CORS: *</text>
    <text x="40" y="125" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">MkDocs</text>
    <text x="40" y="140" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">Link Sent</text>
  </g>

  <!-- Footer Banner -->
  <g transform="translate(40, 395)">
    <rect x="0" y="0" width="1020" height="50" fill="#0f172a" rx="8" stroke="#1e293b" stroke-width="1"/>
    <text x="24" y="30" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">
      <tspan fill="#2dd4bf" font-weight="bold">Fulfillment Invariant:</tspan> Zero lost leads · Fail-closed data validation · Verified dispatch to azengineeringapp@gmail.com
    </text>
  </g>
</svg>
